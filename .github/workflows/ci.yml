name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, tests, graph smoke test, Studio build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Only the TypeScript is compiled here; the Electron binary is never run.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Typecheck (factory and studio)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Executes the full multi-agent graph with stubbed LLM calls: no credentials,
      # no network, no repository mutation.
      - name: Graph smoke test (dry run)
        run: npm run smoke
        env:
          # Kept (relative to factory/), so the traces can be uploaded when a scenario fails.
          FACTORY_LOG_DIR: ./logs

      # Bundles the Electron main process, the preload script and the React renderer.
      # Packaging an installer (electron-builder) is a release concern, not a CI one.
      - name: Build the Studio
        run: npm run build

      - name: Upload run traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-run-traces
          path: factory/logs/
          retention-days: 7
          if-no-files-found: ignore
